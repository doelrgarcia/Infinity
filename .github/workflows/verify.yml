name: Windows offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Isolate generated files
        run: |
          $work = Join-Path C:\tmp ('Infinity-ci-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          "INFINITY_CI_WORK=$work" >> $env:GITHUB_ENV
          "TEMP=$work" >> $env:GITHUB_ENV
          "TMP=$work" >> $env:GITHUB_ENV
          "PYTHONDONTWRITEBYTECODE=1" >> $env:GITHUB_ENV
          "UseSharedCompilation=false" >> $env:GITHUB_ENV
          "MSBUILDDISABLENODEREUSE=1" >> $env:GITHUB_ENV
      - name: Packaging and contract guards
        run: |
          python scripts/test_verify_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_build_msi.py
          exit $LASTEXITCODE
      - name: Build clean public configuration
        run: |
          dotnet build LocalAI.Desktop -c Release --artifacts-path "$env:INFINITY_CI_WORK/build" -p:NuGetAudit=true -p:NuGetAuditMode=all
          exit $LASTEXITCODE
      - name: Offline file, command, and source control checks
        run: |
          foreach ($item in @(@('LocalAI.FileTests','files'), @('LocalAI.CommandTests','commands'), @('LocalAI.SourceTests','source'))) {
            dotnet run --project $item[0] -c Release --artifacts-path "$env:INFINITY_CI_WORK/$($item[1])-build" -- "$env:INFINITY_CI_WORK/$($item[1]).json"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Remove owned output
        if: always()
        run: |
          if ($env:INFINITY_CI_WORK) {
            python -c "import os,pathlib,shutil; p=pathlib.Path(os.environ['INFINITY_CI_WORK']).resolve(); assert p.parent==pathlib.Path('C:/tmp') and p.name.startswith('Infinity-ci-'); assert not p.is_symlink(); shutil.rmtree(p) if p.exists() else None"
          }
